version: 2

updates:
  - package-ecosystem: "nuget"
    # doesn't cover the WDK packages in src/Vac/packages.config: Dependabot only reads .NET projects, not .vcxproj
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft-and-system:
        patterns: ["Microsoft.*", "System.*"]
      microsoft-and-system-security:
        applies-to: security-updates
        patterns: ["Microsoft.*", "System.*"]
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry.*"]
      serilog:
        patterns: ["Serilog*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      # @types/node follows the Node version (volta.node in package.json)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
        # changes the allowScripts entry, so it needs "npm run allow-scripts:auto"
        exclude-patterns: ["esbuild"]
      # can move esbuild, which needs "npm run allow-scripts:auto"
      vite-and-vitest:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*", "vitest-browser-react"]
      playwright:
        patterns: ["playwright", "@playwright/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      fluentui:
        patterns: ["@fluentui/*"]
      eslint:
        patterns: ["eslint", "@eslint/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

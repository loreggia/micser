name: micser CI

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Micser.slnx --configuration Release

      - name: Check OpenAPI document is up to date
        run: git diff --exit-code -- src/WebSdk/openapi

      - name: Test
        run: dotnet test --solution Micser.slnx --configuration Release --no-build

  web:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check API client is up to date
        run: |
          npm run generate:api -w @micser/web-sdk
          git diff --exit-code -- src/WebSdk/src/api/generated

      - name: Build
        run: npm run build

name: micser CI

on:
  push:
  pull_request:

# a newer push to the same branch or PR cancels the run of the older one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Micser.slnx --configuration Release

      - name: Check OpenAPI document is up to date
        run: git diff --exit-code -- src/WebSdk/openapi

      - name: Test
        run: dotnet test --solution Micser.slnx --configuration Release --no-build

  vac:
    # the WDK NuGet packages need the WDK component of Visual Studio, which this image has
    runs-on: windows-2025-vs2026

    strategy:
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the WDK and SDK packages (about 2 GB) that build-vac.ps1 restores
      - name: Cache the WDK packages
        uses: actions/cache@v6
        with:
          path: src/Vac/packages
          key: vac-packages-${{ hashFiles('src/Vac/packages.config') }}

      - name: Build and verify
        run: ./eng/build-vac.ps1 -Configuration Release -Platform ${{ matrix.platform }}

  vac-codeql:
    # like the vac job
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the WDK and SDK packages (about 2 GB) that build-vac.ps1 restores
      - name: Cache the WDK packages
        uses: actions/cache@v6
        with:
          path: src/Vac/packages
          key: vac-packages-${{ hashFiles('src/Vac/packages.config') }}

      - name: CodeQL driver checks
        run: ./eng/codeql-vac.ps1

      - name: Upload CodeQL results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vac-codeql
          path: artifacts/codeql/vac.sarif
          if-no-files-found: ignore

  web:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        uses: ./.github/actions/npm-install

      - name: Check the install script allowlist is up to date
        run: |
          npm run allow-scripts:auto
          git diff --exit-code -- "*package.json"

      - name: Get the Playwright version
        id: playwright
        run: "\"version=$((npx playwright --version).Split(' ')[-1])\" >> $env:GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for the browser tests
        run: npx playwright install chromium

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check API client is up to date
        run: |
          npm run generate:api -w @micser/web-sdk
          git diff --exit-code -- src/WebSdk/src/api/generated

      - name: Build
        run: npm run build

  e2e:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        uses: ./.github/actions/npm-install

      - name: Get the Playwright version
        id: playwright
        run: "\"version=$((npx playwright --version).Split(' ')[-1])\" >> $env:GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: npx playwright install chromium

      # the published engine serves the built UI and plugin widgets, as in a release
      - name: Build the UI
        run: npm run build

      - name: Publish the engine
        run: dotnet publish src/Engine --configuration Release --output artifacts/e2e-engine

      - name: End-to-end tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
        env:
          MICSER_E2E_PUBLISHED_ENGINE: ${{ github.workspace }}/artifacts/e2e-engine/Micser.Engine.dll

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.shard }}
          path: tests/E2E/playwright-report

  release:
    needs: [dotnet, vac, vac-codeql, web, e2e]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    uses: ./.github/workflows/release.yml

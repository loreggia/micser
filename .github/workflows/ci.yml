name: micser CI

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Micser.slnx --configuration Release

      - name: Check OpenAPI document is up to date
        run: git diff --exit-code -- src/WebSdk/openapi

      - name: Test
        run: dotnet test --solution Micser.slnx --configuration Release --no-build

  vac:
    # the WDK NuGet packages need the WDK component of Visual Studio, which this image has
    runs-on: windows-2025-vs2026

    strategy:
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and verify
        run: ./eng/build-vac.ps1 -Configuration Release -Platform ${{ matrix.platform }}

      - name: CodeQL driver checks
        if: matrix.platform == 'x64'
        run: ./eng/codeql-vac.ps1

      - name: Upload CodeQL results
        if: matrix.platform == 'x64' && always()
        uses: actions/upload-artifact@v7
        with:
          name: vac-codeql
          path: artifacts/codeql/vac.sarif
          if-no-files-found: ignore

  web:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for the browser tests
        run: npx playwright install chromium

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check API client is up to date
        run: |
          npm run generate:api -w @micser/web-sdk
          git diff --exit-code -- src/WebSdk/src/api/generated

      - name: Build
        run: npm run build

  e2e:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      # the tests run it with --no-build
      - name: Build the engine
        run: dotnet build src/Engine --configuration Release

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: tests/E2E/playwright-report
